<div class="no-record-container text-center p-5">
  <div class="icon-wrapper mb-3">
    <mat-icon class="large-icon">{{ icon }}</mat-icon>
  </div>
  <h4 class="font-weight-bold">{{ message }}</h4>
  <p class="text-muted">{{ subMessage }}</p>
  
  <button mat-stroked-button color="primary" *ngIf="showButton" (click)="onAction()" class="mt-2">
    <mat-icon class="btn-icon">refresh</mat-icon>
    {{ buttonText }}
  </button>
</div>
